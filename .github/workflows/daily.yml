name: Daily report

on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC every day
  # front-end changes re-render the committed listings without scraping
  push:
    branches: [main]
    paths: [html_report.py, report.py, .github/workflows/daily.yml]
  workflow_dispatch:  # "Run workflow" button for manual runs; by default only re-renders the committed listings
    inputs:
      scrape:
        description: Scrape listings first
        type: boolean
        default: false

permissions:
  contents: write  # commit refreshed listings
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # a site that fails or blocks us keeps its previous CSV, so the report still builds
      - name: Scrape listings
        if: github.event_name == 'schedule' || inputs.scrape
        run: |
          for site in boat24 scanboat apolloduck marktplaats; do
            python fetch_$site.py || echo "::warning::fetch_$site.py failed; using previous listings"
          done

      - name: Build report
        run: python report.py

      - name: Commit refreshed listings
        if: github.event_name == 'schedule' || inputs.scrape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update listings $(date -u +%F)" || echo "no changes"
          git push

      - name: Prepare site
        run: mkdir site && cp report.html site/index.html && cp vpp.html site/vpp.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
